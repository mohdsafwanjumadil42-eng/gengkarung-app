name: Build Gengkarung AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'
          cache: true

      - name: Extract project
        run: |
          unzip -o gengkarung_flutter_aab_project.zip -d project
          cd project
          shopt -s dotglob
          cp -r . ../
          cd ..
          rm -rf project

      - name: Generate Android platform files
        run: |
          flutter create . \
            --org com.gengkarung \
            --project-name app

      - name: Install dependencies
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gengkarung-aab
          path: build/app/outputs/bundle/release/app-release.aab
